services:
  db:
    container_name: cinemax_db
    image: postgres:17.6
    environment:
      POSTGRES_DB: cinemax
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: cinemax_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:80"
    volumes:
      - "./src:/app"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ".env"

volumes:
  postgres_data: